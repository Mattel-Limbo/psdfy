<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psdfy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #FFD700 0%, #FFC700 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-box {
            border: 4px solid #000;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.3);
        }
        .input-field {
            border: 3px solid #000;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
        }
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 0 3px #FF1493;
        }
        .login-btn {
            background: #FF1493;
            border: 3px solid #000;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3);
        }
        .login-btn:active {
            transform: translate(0, 0);
            box-shadow: 0 0 0px rgba(0, 0, 0, 0.3);
        }
        .error-message {
            background: #FF6B6B;
            border: 3px solid #000;
            color: #000;
            padding: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="login-box bg-white p-12">
            <!-- Title -->
            <h1 class="text-center text-5xl font-black mb-2">Psdfy</h1>
            <p class="text-center text-lg font-bold mb-8">Masuk ke akun Anda</p>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message hidden mb-4">
                Password salah. Silakan coba lagi.
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold mb-2">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="input-field w-full"
                        placeholder="••••••••"
                    />
                </div>

                <button
                    type="submit"
                    class="login-btn w-full"
                >
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/ui/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `password=${encodeURIComponent(password)}`,
                });
                
                if (response.ok) {
                    // Redirect to home
                    window.location.href = '/';
                } else {
                    errorMessage.classList.remove('hidden');
                    setTimeout(() => {
                        errorMessage.classList.add('hidden');
                    }, 3000);
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
