name: Sync New Tag to Master and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$GITHUB_REF" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    
    - name: Fetch master branch
      run: |
        git fetch origin master
    
    - name: Check if tag is newer than latest
      id: check_version
      run: |
        CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        CURRENT_VERSION=${CURRENT_TAG#v}
        NEW_VERSION=${{ steps.version.outputs.version }}
        
        echo "Current version: $CURRENT_VERSION"
        echo "New version: $NEW_VERSION"
        
        # Simple version comparison (works for semantic versioning)
        if [ "$(printf '%s\n' "$CURRENT_VERSION" "$NEW_VERSION" | sort -V | head -n1)" = "$CURRENT_VERSION" ]; then
          echo "is_newer=true" >> $GITHUB_OUTPUT
        else
          echo "is_newer=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Checkout master branch
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout master
    
    - name: Update version in pyproject.toml
      run: |
        python -c "
        import re
        with open('pyproject.toml', 'r') as f:
            content = f.read()
        content = re.sub(r'version = \"[^\"]+\"', f'version = \"${{ steps.version.outputs.version }}\"', content)
        with open('pyproject.toml', 'w') as f:
            f.write(content)
        print('Updated pyproject.toml to version ${{ steps.version.outputs.version }}')
        "
    
    - name: Update version in psdfy/__init__.py
      run: |
        python -c "
        import re
        with open('psdfy/__init__.py', 'r') as f:
            content = f.read()
        content = re.sub(r'__version__ = \"[^\"]+\"', f'__version__ = \"${{ steps.version.outputs.version }}\"', content)
        with open('psdfy/__init__.py', 'w') as f:
            f.write(content)
        print('Updated psdfy/__init__.py to version ${{ steps.version.outputs.version }}')
        "
    
    - name: Commit and push version update to master
      run: |
        git add pyproject.toml psdfy/__init__.py
        git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]" || true
        git push origin master
        echo "Pushed version update to master"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build distribution
      run: |
        python -m build
        echo "Build completed successfully"
    
    - name: Publish to PyPI
      run: |
        python -m twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} --non-interactive
        echo "Published to PyPI successfully"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Release ${{ steps.version.outputs.version }}
          
          This release has been automatically published to PyPI.
          
          See commit history for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
