name: Sync Master to Latest Tag

on:
  push:
    branches:
      - master
    paths:
      - 'pyproject.toml'
      - 'psdfy/**'
      - '.github/workflows/sync-master-to-latest-tag.yml'

jobs:
  sync-to-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get latest tag
      id: latest_tag
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.5")
        echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest tag: $LATEST_TAG"
    
    - name: Update latest tag to point to current master
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -d ${{ steps.latest_tag.outputs.tag }} || true
        git push origin :refs/tags/${{ steps.latest_tag.outputs.tag }} || true
        git tag -a ${{ steps.latest_tag.outputs.tag }} -m "Latest release pointing to master"
        git push origin ${{ steps.latest_tag.outputs.tag }}
        echo "Updated tag ${{ steps.latest_tag.outputs.tag }} to current master commit"
